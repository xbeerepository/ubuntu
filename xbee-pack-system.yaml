schema-version: 1.0

system:
    user: ubuntu
    container: "{{ .xbee.name }}:{{ .xbee.ref }}"

dev: ./ubuntu-dev

var:
    xbee:
        version: 26.04
        user: ubuntu
        group: ubuntu
    timezone:
        region: Europe
        city: Paris

provider:
    virtualbox:
        disk: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.vmdk
        ostype: Ubuntu_64
        cloud-init: |
            rm /etc/machine-id
            systemd-machine-id-setup
            cat > /etc/netplan/xbee.yaml <<EOF
            network:
                version: 2
                ethernets:
                    enp0s8:
                        dhcp4: true
                        dhcp6: true
            EOF
            chmod 600 /etc/netplan/xbee.yaml
            netplan apply
            systemctl restart systemd-networkd
    aws:
