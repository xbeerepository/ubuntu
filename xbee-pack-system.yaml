schema-version: 1.0

system:
    user: ubuntu
    container: "ubuntu:{{ .xbee.version }}"

dev: ./ubuntu-dev

var:
    xbee:
        version: 24.04
        user: ubuntu
        group: ubuntu
    timezone:
        region: Europe
        city: Paris

provider:
    firecracker:
        kernel:
            url: https://github.com/xbeerepository/lfs/releases/download/v0.3.5/xbee-kernel-6.18.10-r6-microvm-x86_64.tar.zst
            bundleSha256: e0c528dd637fad5b4f203c011aff065bd389df416497d6e4afbef8be64260add
            name: xbee-kernel
            version: 6.18.10
            revision: "6"
            variant: microvm
            architecture: x86_64
            release: 6.18.10-xbee-lfs
    cloud-hypervisor:
        kernel:
            url: https://github.com/xbeerepository/lfs/releases/download/v0.3.5/xbee-kernel-6.18.10-r6-microvm-x86_64.tar.zst
            bundleSha256: e0c528dd637fad5b4f203c011aff065bd389df416497d6e4afbef8be64260add
            name: xbee-kernel
            version: 6.18.10
            revision: "6"
            variant: microvm
            architecture: x86_64
            release: 6.18.10-xbee-lfs
    qemu:
        kernel:
            url: https://github.com/xbeerepository/lfs/releases/download/v0.3.5/xbee-kernel-6.18.10-r6-microvm-x86_64.tar.zst
            bundleSha256: e0c528dd637fad5b4f203c011aff065bd389df416497d6e4afbef8be64260add
            name: xbee-kernel
            version: 6.18.10
            revision: "6"
            variant: microvm
            architecture: x86_64
            release: 6.18.10-xbee-lfs
    ionos:
        imageAlias:
            linux_amd64: ubuntu:24.04
    ovh:
        image: Ubuntu 24.04
    virtualbox:
        disk: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.vmdk
        ostype: Ubuntu_64
        cloud-init: |
            rm /etc/machine-id
            systemd-machine-id-setup
            cat > /etc/netplan/xbee.yaml <<EOF
            network:
                version: 2
                ethernets:
                    enp0s8:
                        dhcp4: true
                        dhcp6: true
            EOF
            chmod 600 /etc/netplan/xbee.yaml
            netplan apply
            systemctl restart systemd-networkd
